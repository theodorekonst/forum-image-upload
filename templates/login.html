<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <main class="auth-page">
            <section class="form-panel" aria-labelledby="login-heading">
                <h1 id="login-heading">Log in</h1>
                <form class="content-form" method="POST" action="/login">
                    {{if .Error}}
                    <p class="form-error">{{.Error}}</p>
                    {{end}}
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" name="email" value="{{.Email}}" required>

                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" required>

                    <button type="submit">Log in</button>
                    <p class="form-copy">Don't have an account? <a href="/register">Register</a></p>
                </form>
            </section>
        </main>
    </body>
</html>
