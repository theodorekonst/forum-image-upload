<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/images/01%20orange.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="site-nav">
        <a class="site-logo" href="/">
            <img src="/static/images/Logo%20Full%20Orange.svg" alt="Forum home">
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <main class="content-page">
        <section class="form-panel" aria-labelledby="create-post-heading">
            <h1 id="create-post-heading" class="sr-only">Create post</h1>
            <form class="content-form" method="POST" action="/post/create">
				{{if .Error}}
				<p class="form-error">{{.Error}}</p>
				{{end}}
                <label for="post-title">Title</label>
                <input id="post-title" type="text" name="title" value="{{.Title}}" required>

                <label for="post-content">Content</label>
                <textarea id="post-content" name="content" required>{{.Content}}</textarea>

                <fieldset class="category-options">
                    <legend>Categories</legend>
                    {{range .Categories}}
                    <label>
                        <input type="checkbox" name="categories" value="{{.ID}}">
                        {{.Name}}
                    </label>
                    {{end}}
                </fieldset>

                <button type="submit">Publish post</button>
            </form>
        </section>
    </main>

</body>

</html>
