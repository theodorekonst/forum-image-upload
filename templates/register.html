<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <main class="auth-page">
            <section class="form-panel" aria-labelledby="register-heading">
                <h1 id="register-heading">Register</h1>
                <form class="content-form" method="POST" action="/register">
                    {{if .Error}}
                    <p class="form-error">{{.Error}}</p>
                    {{end}}
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" name="email" value="{{.Email}}" required>

                    <label for="register-username">Username</label>
                    <input id="register-username" type="text" name="username" value="{{.Username}}" required>

                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" name="password" required>

                    <button type="submit">Register</button>
                    <p class="form-copy">Already have an account? <a href="/login">Log in</a></p>
                </form>
            </section>
        </main>
    </body>
</html>
